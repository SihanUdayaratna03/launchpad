apiVersion: v1
kind: ServiceAccount
metadata:
  name: launchpad-controller
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: launchpad-controller
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applicationsets"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: launchpad-controller
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: launchpad-controller
    namespace: argocd
roleRef:
  kind: Role
  name: launchpad-controller
  apiGroup: rbac.authorization.k8s.io
